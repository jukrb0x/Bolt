# bolt.local.yaml — optional per-machine overrides (gitignored)
#
# Copy to bolt.local.yaml. A missing file is fine.
# `vars` override bolt.yaml vars. `plugins.<namespace>` is deep-merged over
# the config of the bolt.yaml plugin with that namespace, so machine paths
# stay out of the committed bolt.yaml.
# `capabilities.<tag>` overrides that one key from bolt.yaml ({} is the same
# as omitting the key). Example: vcs.sync: svn/update

# vars:
#   region: eu
# plugins:
#   ue:
#     engine: { path: D:/UE_5.4 }
#     project: { path: D:/Work/MyGame }
#     uproject: D:/Work/MyGame/MyGame.uproject
#   svn:
#     use_tortoise: true
