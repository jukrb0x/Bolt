name: Verify Windows release install

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: windows-latest install from GitHub Release
    runs-on: windows-latest
    steps:
      - name: Install from the public release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The expected version is the latest public tag with the leading v removed.
          $release = Invoke-RestMethod "https://api.github.com/repos/jukrb0x/Bolt/releases/latest"
          $tag = [string]$release.tag_name
          Write-Host "Release URL: $($release.html_url)"
          if (-not $tag.StartsWith("v") -or $tag.Length -lt 2) {
            throw "latest release tag '$tag' has no version after v"
          }
          $expected = $tag.Substring(1)
          irm https://raw.githubusercontent.com/jukrb0x/Bolt/main/install.ps1 | iex
          # install.ps1 updates the user Path and says to open a new terminal.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + [Environment]::GetEnvironmentVariable("Path", "Machine")
          Write-Host "bolt: $((Get-Command bolt).Source)"
          $version = (bolt --version | Out-String).Trim()
          Write-Host "bolt --version: $version"
          if ($version -cne $expected) {
            throw "bolt --version '$version' did not match tag $tag"
          }
          Write-Host "bolt --version matched tag $tag"
