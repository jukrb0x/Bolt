name: Verify Windows release install

# Live release, so this follows a successful Release run rather than every pull request.
# workflow_run, not `release: published`: Release publishes with GITHUB_TOKEN, which
# does not start workflows that listen for the release event.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  install:
    name: windows-latest install from GitHub Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Install from the public release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod "https://api.github.com/repos/jukrb0x/Bolt/releases/latest" -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          # install.ps1 runs in this scope and assigns $Expected, so keep the tag in the environment.
          $env:BOLT_RELEASE_TAG = [string]$release.tag_name
          Write-Host "Release URL: $($release.html_url)"
          if (-not $env:BOLT_RELEASE_TAG.StartsWith("v") -or $env:BOLT_RELEASE_TAG.Length -lt 2) {
            throw "latest release tag '$($env:BOLT_RELEASE_TAG)' has no version after v"
          }
          irm https://raw.githubusercontent.com/jukrb0x/Bolt/main/install.ps1 | iex
          # install.ps1 updates the user Path and says to open a new terminal.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + [Environment]::GetEnvironmentVariable("Path", "Machine")
          Write-Host "bolt: $((Get-Command bolt).Source)"
          $got = (bolt --version | Out-String).Trim()
          $want = $env:BOLT_RELEASE_TAG.Substring(1)
          Write-Host "bolt --version: $got"
          if ($got -cne $want) {
            throw "bolt --version '$got' did not match '$want' from tag $($env:BOLT_RELEASE_TAG)"
          }
          Write-Host "bolt --version matched tag $($env:BOLT_RELEASE_TAG)"
