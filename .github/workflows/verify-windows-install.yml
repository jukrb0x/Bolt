name: Verify Windows release install

# Live release, so this follows a successful Release run rather than every pull request.
# workflow_run, not `release: published`: Release publishes with GITHUB_TOKEN, which
# does not start workflows that listen for the release event.
#
# The newest-release URL skips prereleases, so a tag such as v2.2.0-rc.1 would be
# checked as the previous stable release. Release runs on a tag push, and that
# run's head_branch is the tag. A manual run passes the same tag as an input.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install, for example v2.1.6 or v2.2.0-rc.1
        required: true
        type: string
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  install:
    name: windows-latest install from GitHub Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      # Only for scripts/self-update-tag.ps1. The binary comes from the published release.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Install from the published release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = [string]$env:RELEASE_TAG
          # Same shape the Release workflow stamps. Rejects an uppercase V and a trailing newline.
          # src/tests/self-update-tag.test.ts runs this block under pwsh.
          # BEGIN tag-check
          $tagScript = Join-Path $env:GITHUB_WORKSPACE "scripts/self-update-tag.ps1"
          if (-not (Test-Path -LiteralPath $tagScript)) {
            throw "scripts/self-update-tag.ps1 not found in the checked-out ref $env:GITHUB_REF ($env:GITHUB_SHA). This ref predates the script; re-run with workflow_dispatch on main or a newer tag."
          }
          # The script exits 1 on an invalid tag. Stop does not turn an exit code into an error.
          # Install only needs validity; the prerelease/stable mode it prints is not used.
          $null = & $tagScript -Tag $tag
          if ($LASTEXITCODE -ne 0) {
            throw "Tag validation failed for '$tag' (exit $LASTEXITCODE); see the error above."
          }
          # END tag-check
          $release = Invoke-RestMethod -Headers @{
            Authorization = "Bearer ${{ github.token }}"
            Accept        = "application/vnd.github+json"
            "User-Agent"  = "bolt-self-update"
          } -Uri "https://api.github.com/repos/jukrb0x/Bolt/releases/tags/$tag"
          if ([string]$release.tag_name -cne $tag) {
            throw "release tag_name '$($release.tag_name)' did not match $tag"
          }
          $updateUrl = [string]$release.html_url
          if ($updateUrl -notmatch '^https://github\.com/jukrb0x/Bolt/releases/tag/v') {
            throw "release URL is not a public Bolt tag: $updateUrl"
          }
          $asset = $release.assets | Where-Object { $_.name -eq "bolt-win-x64.exe" } | Select-Object -First 1
          if (-not $asset) { throw "$tag has no bolt-win-x64.exe" }
          $assetUrl = [string]$asset.browser_download_url
          $expectedAsset = "https://github.com/jukrb0x/Bolt/releases/download/$tag/bolt-win-x64.exe"
          if ($assetUrl -cne $expectedAsset) {
            throw "asset URL is not the public download: $assetUrl"
          }
          # install.ps1 assigns $Expected, so keep the tag in the environment.
          # Without BOLT_INSTALL_BASE the script downloads the newest stable release.
          $env:BOLT_RELEASE_TAG = $tag
          $env:BOLT_INSTALL_BASE = "https://github.com/jukrb0x/Bolt/releases/download/$tag"
          Write-Host "Release URL: $updateUrl"
          Write-Host "Install base: $env:BOLT_INSTALL_BASE"
          irm https://raw.githubusercontent.com/jukrb0x/Bolt/main/install.ps1 | iex
          # install.ps1 updates the user Path and says to open a new terminal.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + [Environment]::GetEnvironmentVariable("Path", "Machine")
          Write-Host "bolt: $((Get-Command bolt).Source)"
          $got = (bolt --version | Out-String).Trim()
          $want = $tag.Substring(1)
          Write-Host "bolt --version: $got"
          if ($got -cne $want) {
            throw "bolt --version '$got' did not match '$want' from tag $tag"
          }
          Write-Host "bolt --version matched tag $tag"
