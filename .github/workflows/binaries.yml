name: Binaries

on:
  workflow_call:
    inputs:
      version:
        description: "Version stamped into the binaries before compile. Empty keeps src/version.ts."
        type: string
        required: false
        default: ""
      publish:
        description: "Create a GitHub Release from the smoke-tested binaries."
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "refusing to stamp version: $VERSION"
            exit 1
          fi
          printf '%s\n' \
            '// Stamped by the release workflow. Not committed.' \
            "export const VERSION = \"${VERSION}\";" \
            > src/version.ts

      - name: Build release binaries
        run: bun run build:binaries

      - name: Smoke linux-x64
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          bash scripts/smoke-binary.sh build/bolt-linux-x64 "$VERSION"

      - name: Verify checksums
        run: cd build && sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: bolt-binaries
          path: build/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke ${{ matrix.bin }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: bolt-win-x64.exe
          - os: windows-latest
            bin: bolt-win-x64-baseline.exe
          - os: macos-latest
            bin: bolt-mac-arm64
          - os: macos-latest
            bin: bolt-mac-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bolt-binaries
          path: build

      - name: Smoke
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          bash scripts/smoke-binary.sh "build/${{ matrix.bin }}" "$VERSION"

  publish:
    if: inputs.publish == true
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: bolt-binaries
          path: build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd build && sha256sum -c SHA256SUMS
          cd ..
          git fetch origin main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "Refusing to publish ${TAG}: ${COMMIT} is not on origin/main."
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          NOTES=$(mktemp)
          {
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log "${PREV}..${TAG}" --pretty=format:'- %s'
            else
              git log "$TAG" --pretty=format:'- %s'
            fi
            echo
          } >"$NOTES"
          PRE=()
          case "$TAG" in
            *-* ) PRE+=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            build/bolt-win-x64.exe \
            build/bolt-win-x64-baseline.exe \
            build/bolt-linux-x64 \
            build/bolt-mac-arm64 \
            build/bolt-mac-x64 \
            build/bolt.d.ts \
            build/SHA256SUMS \
            --title "$TAG" \
            --notes-file "$NOTES" \
            "${PRE[@]}"
