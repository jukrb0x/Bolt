name: Release

on:
  push:
    tags:
      - "v*"

# Tag push builds every release binary, smoke-tests it, and publishes a
# GitHub Release with SHA256SUMS. GITHUB_TOKEN is enough; no extra secret.

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ github.ref_name }}
      publish: true
    permissions:
      contents: write
