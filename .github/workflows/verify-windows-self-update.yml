name: Verify Windows self-update

# Live release, so this follows a successful Release run rather than every pull request.
# workflow_run, not `release: published`: Release publishes with GITHUB_TOKEN, which
# does not start workflows that listen for the release event.
#
# The published v2.1.0 binary's self-update calls api.github.com with no Authorization
# header. It reads no GH_TOKEN or GITHUB_TOKEN. The only override is BOLT_RELEASES_API.
# With no --version it requests {base}/latest. --force does not change that path.
# --version <v> would request {base}/tags/<tag> instead; this job does not pass it.
# A shared runner IP gets 403 once the anonymous hourly cap is spent, and retrying
# inside this 15-minute job does not wait that out. This job fetches the triggering
# tag with the workflow token and serves that JSON on localhost, and only for the
# path this run requests. The binary still downloads assets from their public GitHub URLs.
#
# /releases/latest is the newest non-prerelease, so a prerelease tag would be verified
# as the previous stable release. Release runs on a tag push; head_branch is that tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update to, for example v2.1.6 or v2.2.0-rc.1
        required: true
        type: string
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  self-update:
    name: windows-latest self-update against the published release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Update the published v2.1.0 binary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          # main's install.ps1 installs the latest release and would skip 2.1.0.
          # The v2.1.0 installer, pointed at that tag's public assets, writes the
          # receipt self-update requires. BOLT_RELEASES_API stays unset until the
          # local fixture below, so the installer talks to the public download.
          if ($env:BOLT_RELEASES_API) {
            throw "BOLT_RELEASES_API is set ($env:BOLT_RELEASES_API). This job must install from the public v2.1.0 assets."
          }
          $env:BOLT_INSTALL_BASE = "https://github.com/jukrb0x/Bolt/releases/download/v2.1.0"
          Write-Host "Start release URL: https://github.com/jukrb0x/Bolt/releases/tag/v2.1.0"
          Write-Host "Start asset URL: $env:BOLT_INSTALL_BASE/bolt-win-x64.exe"
          irm https://raw.githubusercontent.com/jukrb0x/Bolt/v2.1.0/install.ps1 | iex
          Remove-Item Env:BOLT_INSTALL_BASE

          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + [Environment]::GetEnvironmentVariable("Path", "Machine")
          $boltDest = Join-Path $env:LOCALAPPDATA "bolt\bin\bolt.exe"
          $old = "$boltDest.old"
          $bolt = (Get-Command bolt).Source
          Write-Host "bolt: $bolt"
          if ($bolt.TrimEnd("\").ToLower() -ne $boltDest.TrimEnd("\").ToLower()) {
            throw "PATH resolved bolt to '$bolt', expected '$boltDest'"
          }
          if (Test-Path -LiteralPath $old) { throw "bolt.exe.old existed before self-update" }

          $sumsFile = Join-Path $env:TEMP "bolt-v210-SHA256SUMS"
          Invoke-WebRequest -Uri "https://github.com/jukrb0x/Bolt/releases/download/v2.1.0/SHA256SUMS" -OutFile $sumsFile -UseBasicParsing
          $expected210 = $null
          foreach ($line in @(Get-Content -LiteralPath $sumsFile)) {
            if ($line -match '^([a-fA-F0-9]{64})  (\S+)$' -and $Matches[2] -eq "bolt-win-x64.exe") {
              $expected210 = $Matches[1].ToLower()
            }
          }
          if (-not $expected210) {
            Write-Host "---- v2.1.0 SHA256SUMS ----"
            Get-Content -LiteralPath $sumsFile | ForEach-Object { Write-Host $_ }
            throw "v2.1.0 SHA256SUMS has no bolt-win-x64.exe entry"
          }
          $installedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $boltDest).Hash.ToLower()
          Write-Host "installed sha256: $installedHash"
          if ($installedHash -ne $expected210) {
            throw "installed bolt.exe is not the published v2.1.0 bolt-win-x64.exe"
          }

          $installed = (bolt --version | Out-String).Trim()
          Write-Host "bolt --version: $installed"
          if ($installed -cne "2.1.0") { throw "bolt --version '$installed' is not 2.1.0" }

          $tag = [string]$env:RELEASE_TAG
          # Same shape the Release workflow stamps. A hyphen marks a prerelease.
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            throw "release tag '$tag' is not a public version"
          }
          if ($tag -ceq "v2.1.0") {
            throw "release tag is still v2.1.0, so self-update would not replace the binary"
          }
          $resp = Invoke-WebRequest -UseBasicParsing -Headers @{
            Authorization = "Bearer ${{ github.token }}"
            Accept        = "application/vnd.github+json"
            "User-Agent"  = "bolt-self-update"
          } -Uri "https://api.github.com/repos/jukrb0x/Bolt/releases/tags/$tag"
          $raw = $resp.Content
          if ($raw -is [byte[]]) { $raw = [Text.Encoding]::UTF8.GetString($raw) }
          $release = $raw | ConvertFrom-Json
          if ([string]$release.tag_name -cne $tag) {
            throw "release tag_name '$($release.tag_name)' did not match $tag"
          }
          $updateUrl = [string]$release.html_url
          if ($updateUrl -notmatch '^https://github\.com/jukrb0x/Bolt/releases/tag/v') {
            throw "update release URL is not a public Bolt tag: $updateUrl"
          }
          $updateAsset = $release.assets | Where-Object { $_.name -eq "bolt-win-x64.exe" } | Select-Object -First 1
          $sumsAsset = $release.assets | Where-Object { $_.name -eq "SHA256SUMS" } | Select-Object -First 1
          if (-not $updateAsset -or -not $sumsAsset) { throw "$tag is missing bolt-win-x64.exe or SHA256SUMS" }
          $expectedAsset = "https://github.com/jukrb0x/Bolt/releases/download/$tag/bolt-win-x64.exe"
          $expectedSums = "https://github.com/jukrb0x/Bolt/releases/download/$tag/SHA256SUMS"
          if ([string]$updateAsset.browser_download_url -cne $expectedAsset) {
            throw "update asset URL is not the public download: $($updateAsset.browser_download_url)"
          }
          if ([string]$sumsAsset.browser_download_url -cne $expectedSums) {
            throw "checksum URL is not the public download: $($sumsAsset.browser_download_url)"
          }
          Write-Host "Release URL used for the update: $updateUrl"
          Write-Host "Update asset URL: $expectedAsset"

          # v2.1.0 releaseApiUrl: no --version → {BOLT_RELEASES_API}/latest.
          # --force still uses that path. --version would use /tags/<tag>.
          $allowedPath = "/repos/jukrb0x/Bolt/releases/latest"
          $listener = $null
          $server = $null
          $async = $null
          $runspace = $null
          $preferred = 8765
          $port = $preferred
          try {
            function Test-PortInUse($ErrorRecord) {
              $text = $ErrorRecord.Exception.ToString()
              if ($text -match 'conflicts with an existing registration|address already in use|Only one usage of each socket address') {
                return $true
              }
              $inner = $ErrorRecord.Exception
              while ($inner) {
                if ($inner -is [System.Net.Sockets.SocketException] -and
                    $inner.SocketErrorCode -eq [System.Net.Sockets.SocketError]::AddressAlreadyInUse) {
                  return $true
                }
                $inner = $inner.InnerException
              }
              return $false
            }
            function Start-ReplayListener([int]$ListenPort) {
              $created = [System.Net.HttpListener]::new()
              $created.Prefixes.Add("http://127.0.0.1:${ListenPort}/")
              try {
                $created.Start()
              } catch {
                try { $created.Close() } catch {}
                throw
              }
              return $created
            }
            try {
              $listener = Start-ReplayListener $preferred
            } catch {
              if (-not (Test-PortInUse $_)) { throw }
              Write-Host "port $preferred is already in use: $($_.Exception.Message)"
              $listener = $null
              for ($n = 0; $n -lt 5 -and -not $listener; $n++) {
                $tcp = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
                $tcp.Start()
                $port = ([System.Net.IPEndPoint]$tcp.LocalEndpoint).Port
                $tcp.Stop()
                try {
                  $listener = Start-ReplayListener $port
                } catch {
                  if (-not (Test-PortInUse $_)) { throw }
                  Write-Host "port $port is already in use: $($_.Exception.Message)"
                }
              }
              if (-not $listener) { throw "port $port is already in use" }
            }
            Write-Host "release replay listening on 127.0.0.1:$port"
            $runspace = [runspacefactory]::CreateRunspace()
            $runspace.Open()
            $server = [powershell]::Create()
            $server.Runspace = $runspace
            [void]$server.AddScript({
              param($Listener, $Body, $AllowedPath)
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($Body)
              while ($Listener.IsListening) {
                try { $ctx = $Listener.GetContext() } catch { break }
                try {
                  $path = $ctx.Request.Url.AbsolutePath
                  if ($path -cne $AllowedPath) {
                    $ctx.Response.StatusCode = 404
                    $ctx.Response.ContentLength64 = 0
                    continue
                  }
                  $ctx.Response.StatusCode = 200
                  $ctx.Response.ContentType = "application/json"
                  $ctx.Response.ContentLength64 = $bytes.LongLength
                  $ctx.Response.OutputStream.Write($bytes, 0, $bytes.Length)
                } finally {
                  try { $ctx.Response.OutputStream.Close() } catch {}
                }
              }
            }).AddArgument($listener).AddArgument($raw).AddArgument($allowedPath)
            $async = $server.BeginInvoke()

            $origin = "http://127.0.0.1:$port"
            $fixture = "$origin$allowedPath"
            $probe = $null
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $probe = Invoke-RestMethod -Uri $fixture -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 100
              }
            }
            if (-not $probe) { throw "local release fixture did not answer at $fixture" }
            if ([string]$probe.tag_name -cne $tag) {
              throw "local fixture tag '$($probe.tag_name)' did not match $tag"
            }
            # --version <tag> is the only v2.1.0 mode that requests /tags/<tag>.
            $tagsPath = "/repos/jukrb0x/Bolt/releases/tags/$tag"
            $denied = Invoke-WebRequest -Uri "$origin$tagsPath" -SkipHttpErrorCheck -TimeoutSec 2
            if ([int]$denied.StatusCode -ne 404) {
              throw "replay returned $($denied.StatusCode) for $tagsPath"
            }

            $env:BOLT_RELEASES_API = "$origin/repos/jukrb0x/Bolt/releases"
            # A hyphen is a prerelease. v2.1.0 strips that suffix before comparing,
            # so --force is what makes it install the tag. A stable tag must take
            # the real compare-and-upgrade path, with no --force.
            if ($tag.Contains("-")) {
              Write-Host "self-update mode: prerelease"
              & bolt self-update --force
            } else {
              Write-Host "self-update mode: stable"
              & bolt self-update
            }
            if ($LASTEXITCODE -ne 0) { throw "bolt self-update exited $LASTEXITCODE" }
          } finally {
            Remove-Item Env:BOLT_RELEASES_API -ErrorAction SilentlyContinue
            if ($listener) {
              try { $listener.Stop() } catch {}
              try { $listener.Close() } catch {}
            }
            if ($server) {
              try { if ($async) { $server.EndInvoke($async) } } catch {}
              try { $server.Dispose() } catch {}
            }
            if ($runspace) {
              try { $runspace.Close() } catch {}
              try { $runspace.Dispose() } catch {}
            }
          }

          if (-not (Test-Path -LiteralPath $old)) {
            throw "self-update did not rename the running exe to bolt.exe.old"
          }
          $oldHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $old).Hash.ToLower()
          if ($oldHash -ne $installedHash) { throw "bolt.exe.old is not the exe that was running" }
          Write-Host "self-update renamed the running exe to bolt.exe.old"

          Write-Host "later launch: bolt --version"
          $updated = (& bolt --version | Out-String).Trim()
          $want = $tag.Substring(1)
          Write-Host "bolt --version: $updated"
          if ($updated -cne $want) {
            throw "bolt --version '$updated' did not match '$want' from $updateUrl"
          }
          if (Test-Path -LiteralPath $old) { throw "the later launch left bolt.exe.old in place" }
          Write-Host "later launch removed bolt.exe.old"

          $newSumsFile = Join-Path $env:TEMP "bolt-updated-SHA256SUMS"
          Invoke-WebRequest -Uri "https://github.com/jukrb0x/Bolt/releases/download/$tag/SHA256SUMS" -OutFile $newSumsFile -UseBasicParsing
          $expectedNew = $null
          foreach ($line in @(Get-Content -LiteralPath $newSumsFile)) {
            if ($line -match '^([a-fA-F0-9]{64})  (\S+)$' -and $Matches[2] -eq "bolt-win-x64.exe") {
              $expectedNew = $Matches[1].ToLower()
            }
          }
          if (-not $expectedNew) {
            Write-Host "---- $tag SHA256SUMS ----"
            Get-Content -LiteralPath $newSumsFile | ForEach-Object { Write-Host $_ }
            throw "$tag SHA256SUMS has no bolt-win-x64.exe entry"
          }
          $newHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $boltDest).Hash.ToLower()
          Write-Host "updated sha256: $newHash"
          if ($newHash -ne $expectedNew) {
            throw "updated bolt.exe is not the published $tag bolt-win-x64.exe"
          }
          if ($newHash -eq $installedHash) { throw "self-update left the v2.1.0 bytes in place" }
          Write-Host "bolt --version moved from 2.1.0 to $updated"
