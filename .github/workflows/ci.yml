name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Test
        run: bun run test

  e2e:
    name: e2e ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: End-to-end
        run: bun run test:e2e

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generated docs are up to date
        run: bun run docs:gen && git diff --exit-code -- apps/docs && test -z "$(git status --porcelain -- apps/docs)"

      - name: Mintlify validate
        working-directory: apps/docs
        run: bunx mint validate

      - name: Mintlify broken links
        working-directory: apps/docs
        run: bunx mint broken-links

  # Two compiled builds, served locally. The public `irm | iex` run is not here:
  # it has to hit a real GitHub Release, and that tag does not exist yet.
  windows-install:
    name: windows install (${{ matrix.host }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Windows PowerShell 5.1 and PowerShell 7.
        host: [powershell, pwsh]
    timeout-minutes: 45
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install from a local release and self-update
        shell: pwsh
        run: ${{ matrix.host }}.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-install-e2e.ps1

  # Same name the old live-release job used. Branch protection may require it.
  # This run is the local fixture above, not the published GitHub Release.
  windows-self-update:
    name: windows-latest self-update from v2.1.0
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install from a local release and self-update
        shell: pwsh
        run: pwsh.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-install-e2e.ps1

  # Pull requests and main. Tag pushes are built by the Release workflow.
  binaries:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/binaries.yml
