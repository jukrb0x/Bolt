# bolt.yaml — pipeline contract (commit this)
#
# Generic metadata only. Unreal Engine settings belong to the ue plugin.
# See src/plugins/ue.example.yaml.
#
# Optional: stop the run if it exceeds this duration
# timeout_hours: 6
#
# Optional: notify via WeCom or Telegram. Keep secrets out of the committed file.
# notifications:
#   on_start: true
#   on_failure: true
#   on_complete: true
#   providers: []
#
# Optional: load a project plugin by path. A pathless entry only carries config
# for a builtin (the registry does not import it).
# plugins:
#   - namespace: myplugin
#     path: ./bolt-plugins/myplugin/index.ts

version: 1

project:
  name: MyProject

# vars:
#   region: us

# tasks: the only building block. A task is a named list of steps.
# Step keys: `uses` (plugin), `call` (another task), `run` (shell).
tasks:
  hello:
    - run: echo "hello from ${{ project.name }}"

# flows: named, ordered goals. `bolt run <flow>` runs the steps in order.
flows:
  demo:
    description: Say hello
    steps: [hello]

# Usage:
#   bolt run hello
#   bolt run demo
#   bolt run demo --dry-run
